<!DOCTYPE html>
<html lang="en">
<head>

        }

        .abll{
            background-color: white;
            border: 4px solid;
            margin: auto;
            border-color: blue;
            text-align: center;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="sansar">

            </div>
            <div class="abll" style="height: 40px; width: 40%;">
                Menü
            </div>
        </header>

        <section style="display: flex; padding-bottom: 4px;">
            <div class="all" style="height: 500px; width: 80%;">
                İçerik

        </section>

        <footer style="display: flex; width: 80%; margin-left: 10%;">

            <div class="all" style="height: 100px; width: 50%;">
